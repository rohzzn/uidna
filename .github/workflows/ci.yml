name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w @rohzzn/uidna-schema
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run docs:check
      - run: npm run test:unit
      - name: Upload unit diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-diagnostics
          path: |
            tests/.tmp/**/*.log
            tests/.tmp/**/*.json
            tests/.tmp/**/*.png
          if-no-files-found: ignore

  loop:
    name: ${{ matrix.suite.name }} (real Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: 'Phase 1 loop on Fixture A + MCP', files: 'tests/loop.e2e.test.ts tests/mcp.e2e.test.ts' }
          - { name: 'Phase 2 multi-page on Fixture D', files: 'tests/multipage.e2e.test.ts' }
          - { name: 'Phase 2 forms and data on Fixture C', files: 'tests/forms.e2e.test.ts' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx vitest run --project e2e ${{ matrix.suite.files }}
      - name: Upload loop artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ strategy.job-index }}
          path: |
            tests/.tmp/**/scan.json
            tests/.tmp/**/explore.json
            tests/.tmp/**/dna.json
            tests/.tmp/**/diff-report*.json
            tests/.tmp/**/report.html
            tests/.tmp/**/*.png
            tests/.tmp/**/*.log
          if-no-files-found: ignore
